<title>Cellar Price Watch</title>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2333121D'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23D9A441'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --claret:#33121D; --claret-deep:#250D14; --cream:#F5EDDD; --cream-dim:#CDBFA4;
  --brass:#D9A441; --ink:#2A1219; --meta:#7A6656; --red:#B0463A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Work Sans',-apple-system,sans-serif;color:var(--cream);
  background:linear-gradient(180deg,#250D14 0%,var(--claret) 40%,#2C1019 100%);background-attachment:fixed;

button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.frame{max-width:460px;margin:0 auto;padding:28px 16px 0}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:6px}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:34px;line-height:1.05;margin:0;color:var(--cream)}
.hmeta{margin-top:8px;font-size:13px;color:var(--cream-dim)}
.config{background:rgba(217,164,65,.15);border:1px solid var(--brass);border-radius:10px;padding:14px;margin:16px 0;font-size:12px}
.config label{display:block;margin-bottom:8px;color:var(--brass);font-weight:600}

.config .hint{margin-top:6px;color:var(--cream-dim);font-size:11px}
.actions{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.btn{border-radius:10px;padding:12px 16px;font-size:15px;font-weight:500;border:1px solid rgba(245,237,221,.3);background:transparent;color:var(--cream)}
.btn.primary{background:var(--brass);color:var(--ink);border:none;font-weight:600}
.btn.active{border-color:var(--brass);color:var(--brass)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{position:relative;background:var(--cream);color:var(--ink);border-radius:4px;padding:18px 16px 14px;margin-bottom:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.35);border-top:5px solid var(--brass);animation:rise .35s ease both;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;

.stylehead:first-child{margin-top:4px}

.stylepick{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--meta)}

.besttag{display:flex;justify-content:space-between;align-items:baseline;background:var(--ink);color:var(--cream);

.lrow.best{background:rgba(217,164,65,.14);border-radius:4px;padding:9px 8px;margin:0 -6px}

.addlabel{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:600;margin-bottom:8px}
.search{width:100%;font-size:17px;padding:14px;border-radius:10px;border:1px solid rgba(245,237,221,.35);background:rgba(245,237,221,.06);color:var(--cream)}

  border-left:4px solid var(--brass);padding:12px 14px;margin-bottom:8px}

.hidden{display:none}

/* Swipeable pager */
#pager{max-width:460px;margin:0 auto;position:relative;overflow-x:hidden;overflow-x:clip}
.tabbar{display:flex;gap:6px;padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;max-width:460px;margin:0 auto}
.tabbtn{flex:1;background:transparent;border:1px solid rgba(245,237,221,.25);color:var(--cream-dim);
  border-radius:10px;padding:10px 8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s ease}
.tabbtn.active{background:rgba(217,164,65,.16);border-color:var(--brass);color:var(--brass)}
.pages{display:flex;width:200%;transition:transform .32s cubic-bezier(.4,0,.2,1)}
.page{width:50%;flex-shrink:0;box-sizing:border-box}

/* Monthly picks */
.msection{margin-bottom:22px}
.mheading{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--brass);
  margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(245,237,221,.15)}
.mrow{background:var(--cream);color:var(--ink);border-radius:4px;padding:12px 14px;margin-bottom:8px}
.mrowtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mname{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;color:var(--ink);text-decoration:none;flex:1;min-width:0}
.mtag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:2px 6px;flex-shrink:0}
.mrowbottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.mmeta{font-size:11.5px;color:var(--meta)}
.mtrack{background:transparent;border:1px solid rgba(42,18,25,.25);color:#8A4B2F;font-weight:600;
  font-size:11.5px;border-radius:6px;padding:5px 9px;cursor:pointer}
.mtrack:active{background:rgba(217,164,65,.18)}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(245,237,221,.3);border-top-color:var(--brass);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{background:rgba(180,70,58,.2);border:1px solid var(--red);color:var(--red);border-radius:6px;padding:10px;margin:10px 0;font-size:13px}

/* One-time Trolley link per wine */
.linkbox{background:rgba(217,164,65,.12);border:1px dashed rgba(138,75,47,.45);border-radius:6px;padding:12px;margin-bottom:6px;font-size:13px;line-height:1.45}
.linkbox .lbtitle{font-weight:600;margin-bottom:4px}
.linkbox .lbsteps{color:var(--meta);margin-bottom:10px}
.linkbox .findbtn{display:inline-block;background:var(--ink);color:var(--cream);text-decoration:none;font-weight:600;font-size:13px;border-radius:6px;padding:8px 12px;margin-bottom:10px}
.linkbox .lbrow{display:flex;gap:6px}
.linkbox input{flex:1;min-width:0;font-size:16px;padding:8px 10px;border-radius:6px;border:1px solid rgba(42,18,25,.3);background:#fff;color:var(--ink);
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.linkbox .savebtn{background:var(--brass);color:var(--ink);border:none;border-radius:6px;padding:8px 12px;font-weight:600;font-size:14px}
.linkbox .lberr{color:var(--red);font-size:12px;margin-top:6px}
.matched{font-size:11.5px;color:var(--meta);margin-top:4px}
.matched button{background:none;border:none;color:#8A4B2F;text-decoration:underline;font-size:11.5px;padding:0 2px}
</style>

<body>
<div id="pager">

    <div class="frame">
  <header>
    <div class="eyebrow">MONTHLY PICKS · via Luke Flunder</div>
    <h1 id="monthlyTitle">This Month's Picks</h1>
    <div class="hmeta" id="monthlyMeta"></div>

<script>
// btoa/atob only support Latin-1 — wine names with curly quotes, em-dashes,
// or Eastern European letters (ă, ș, etc.) break them. These wrap the string
// through UTF-8 bytes first so any Unicode text encodes/decodes safely.
function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
    (_, hex) => String.fromCharCode(parseInt(hex, 16))));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(Array.prototype.map.call(atob(str),
    c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
}

const MONTHLY_SOURCE_URL = "https://lukeflunder.substack.com/p/the-list";
const MONTHLY_CACHE_KEY = "cellar:monthlyPicks:v1";
const MONTHLY_CACHE_TTL = 12 * 60 * 60 * 1000; // 12h client-side cache

let activePage = 0;
function gotoPage(i){
  activePage = i;
  document.getElementById("pages").style.transform = `translateX(-${i * 50}%)`;
  document.getElementById("tabBtn0").classList.toggle("active", i === 0);
  document.getElementById("tabBtn1").classList.toggle("active", i === 1);
  if(i === 1) loadMonthlyPicks();
}

// swipe: passive listeners only, computed on release — never blocks scrolling, dragging, or taps
(function attachPagerSwipe(){
  const pager = document.getElementById("pager");
  pager.addEventListener("scroll", () => { if(pager.scrollLeft) pager.scrollLeft = 0; }); // paging uses transforms, never scroll
  let sx = 0, sy = 0, st = 0;
  pager.addEventListener("touchstart", e => {
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY; st = Date.now();
  }, { passive: true });
  pager.addEventListener("touchend", e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - st;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 700){
      if(dx < 0 && activePage === 0) gotoPage(1);
      else if(dx > 0 && activePage === 1) gotoPage(0);
    }
  }, { passive: true });
})();

const MONTHLY_STYLE_META = {
  "S": { label: "Sparkling", dot: "#D9A441" },
  "W": { label: "White", dot: "#CDBFA4" },
  "R": { label: "Red", dot: "#8A1F2B" },
  "Ro":{ label: "Rosé", dot: "#D98A8A" },
};
const MONTHLY_TAG_META = {
  "NEW": { bg: "#2A1219", fg: "#F5EDDD" },
  "STAR PICK": { bg: "#D9A441", fg: "#2A1219" },
  "TOP PICK": { bg: "#D9A441", fg: "#2A1219" },
  "PRICE DROP": { bg: "#B0463A", fg: "#F5EDDD" },
};
const MONTHLY_OFFER_LABEL = { CC: "Clubcard", NP: "Nectar", MC: "More Card", AR: "Rollback" };

async function loadMonthlyPicks(force){
  const view = document.getElementById("monthlyView");
  const cachedRaw = !force && localStorage.getItem(MONTHLY_CACHE_KEY);
  if(cachedRaw){
    try {
      const cached = JSON.parse(cachedRaw);
      if(Date.now() - cached.at < MONTHLY_CACHE_TTL){
        renderMonthlyPicks(cached.data);
        return;
      }
    } catch(e){}
  }

  view.innerHTML = `<div class="empty"><div class="glyph">◍</div><p>Fetching this month's picks…</p></div>`;
  try {
    const res = await fetch(API_BASE + "/api/wine-list");
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    localStorage.setItem(MONTHLY_CACHE_KEY, JSON.stringify({ data, at: Date.now() }));
    renderMonthlyPicks(data);
  } catch(e){
    view.innerHTML = `<div class="error">Couldn't load this month's picks (${e.message}). <a href="${MONTHLY_SOURCE_URL}" target="_blank" style="color:inherit;text-decoration:underline">View directly on Substack ↗</a></div>`;
  }
}

// Factual origin extraction only — country/region names, never Luke's own
// descriptive commentary (see note on why we don't scrape his tasting notes).
const MONTHLY_COUNTRIES = [
  "England","Scotland","Wales","France","Spain","Italy","Portugal","Germany","Austria",
  "Greece","Chile","Argentina","Australia","New Zealand","South Africa","USA","California",
  "Romania","Moldova","Hungary","Georgia","Lebanon","Croatia","Slovenia","Bulgaria","Uruguay",
  "Brazil","Canada","Japan","Israel","Morocco","Turkey",
].sort((a,b) => b.length - a.length);
function extractOrigin(name){
  const parts = name.split(",").map(p => p.trim());
  if(parts.length > 1){
    const last = parts[parts.length - 1];
    const hit = MONTHLY_COUNTRIES.find(c => last.toLowerCase() === c.toLowerCase());
    if(hit) return hit;
  }
  for(const c of MONTHLY_COUNTRIES){
    const re = new RegExp(`\\b${c.replace(/\s+/g, "\\s+")}\\s*$`, "i");
    if(re.test(name)) return c;
  }
  return null;
}

function renderMonthlyPicks(data){
  document.getElementById("monthlyMeta").textContent = data.month ? data.month : "";
  const view = document.getElementById("monthlyView");

  if(!data.sections || !data.sections.length){
    view.innerHTML = `<div class="empty"><p>No picks found this time. <a href="${MONTHLY_SOURCE_URL}" target="_blank" style="color:var(--brass)">Check the source ↗</a></p></div>`;
    return;
  }

  view.innerHTML = data.sections.map(section => {
    const rows = section.wines.map(w => {
      const styleMeta = MONTHLY_STYLE_META[w.style] || { label: "", dot: "#8A7A66" };
      const tagMeta = w.tag ? (MONTHLY_TAG_META[w.tag] || { bg: "#8A7A66", fg: "#fff" }) : null;
      const offerLabel = w.offerCode ? MONTHLY_OFFER_LABEL[w.offerCode] || w.offerCode : null;
      const origin = extractOrigin(w.name);
      const encoded = b64EncodeUnicode(JSON.stringify({ name: w.name, producer:"", grape:"", region:"", country: origin||"", style: (styleMeta.label||"").toLowerCase() }));
      return `<div class="mrow">
        <div class="mrowtop">
          <span class="dot" style="background:${styleMeta.dot}"></span>
          <a href="${w.url}" target="_blank" class="mname">${w.name}</a>
          ${tagMeta ? `<span class="mtag" style="background:${tagMeta.bg};color:${tagMeta.fg}">${w.tag}</span>` : ""}
        </div>
        <div class="mrowbottom">
          <span class="mmeta">${[origin, styleMeta.label, offerLabel].filter(Boolean).join(" · ")}</span>
          <button class="mtrack" onclick="addWineFromEncoded('${encoded}'); gotoPage(0)">+ Track this</button>
        </div>
      </div>`;
    }).join("");
    return `<section class="msection">
      <h3 class="mheading">${section.sourceUrl ? `<a href="${section.sourceUrl}" target="_blank" style="color:inherit;text-decoration:none">${section.retailer} <span style="font-size:12px;font-weight:500;color:var(--cream-dim);vertical-align:middle">— read Luke's notes ↗</span></a>` : section.retailer}</h3>
      ${rows}
    </section>`;
  }).join("") + `<p class="footnote">Curated monthly by <a href="${MONTHLY_SOURCE_URL}" target="_blank" style="color:var(--brass)">Luke Flunder on Substack ↗</a>. Tap a section heading to jump straight to his write-up for those wines — his actual tasting notes live there, not here. "+ Track this" adds a wine to My Cellar for price checking.</p>`;
}

const STORAGE_KEY = "cellar:v62";
const RETAILER_META = {
  "Tesco":       { dot:"#00539F", url:q=>`https://www.tesco.com/groceries/en-GB/search?query=${encodeURIComponent(q)}` },
  "Sainsbury's": { dot:"#F06C00", url:q=>`https://www.sainsburys.co.uk/gol-ui/SearchResults/${encodeURIComponent(q)}` },
  "ASDA":        { dot:"#78BE20", url:q=>`https://www.asda.com/groceries/search/${encodeURIComponent(q)}` },
  "Waitrose":    { dot:"#1F4A38", url:q=>`https://www.waitrose.com/ecom/shop/search?&searchTerm=${encodeURIComponent(q)}` },
  "M&S":         { dot:"#111111", url:q=>`https://www.ocado.com/search?q=${encodeURIComponent(q)}` },

  try{ const v = localStorage.getItem(STORAGE_KEY); if(v) return JSON.parse(v); }catch(e){}
  return { wines: [] };
}

function saveState(s){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){}
}

function persist(s){ state = s; saveState(s); }

const gbp = n => (typeof n === "number" && !isNaN(n)) ? "£" + n.toFixed(2) : "—";

// pull a usable price out of an offer string like "£17.50 Clubcard" or "2 for £36"
function offerPrice(p){
  if(!p || typeof p.offer !== "string" || !p.offer) return null;
  const o = p.offer;
  // multibuy: "2 for £36" -> per-unit
  let m = o.match(/(\d+)\s*for\s*£\s*([\d.]+)/i);
  if(m){ const n = parseInt(m[1],10), tot = parseFloat(m[2]); if(n>0 && tot>0) return +(tot/n).toFixed(2); }
  // member/single price: "£17.50 Clubcard"
  m = o.match(/£\s*([\d.]+)/);
  if(m){ const v = parseFloat(m[1]); if(v>0) return v; }
  return null;
}

// the cheapest achievable price at a retailer (shelf price or a lower offer price)
function effectivePrice(p){
  const base = (typeof p.price === "number" && !isNaN(p.price)) ? p.price : Infinity;
  const op = offerPrice(p);
  return (op != null && op < base) ? op : base;
}

function daysAgo(iso){ return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }

function ageLabel(iso){
  const d = daysAgo(iso);
  if(d < 1) return "today";
  if(d === 1) return "1 day ago";
  return d + " days ago";
}

function bestOf(w){
  const entries = (w.prices || []).filter(p => p.stocked && typeof p.price === "number");
  if(!entries.length) return null;
  let best = null, bestEff = Infinity;
  for(const p of entries){
    const eff = effectivePrice(p);
    if(eff < bestEff){ bestEff = eff; best = { ...p, effPrice: eff, discounted: eff < p.price }; }
  }
  return best;
}

function showView(v){
  document.getElementById("listView").classList.toggle("hidden", v !== "list");
  document.getElementById("listActions").classList.toggle("hidden", v !== "list");
  document.getElementById("addView").classList.toggle("hidden", v !== "add");
  if(v === "add"){ const q = document.getElementById("q"); q.value = ""; renderMatches(""); q.focus(); }
  if(v === "list") render();
}

function toggleEdit(){
  editMode = !editMode;
  document.getElementById("editBtn").textContent = editMode ? "Done" : "Edit";
  document.getElementById("editBtn").classList.toggle("active", editMode);
  render();
}

function renderMatches(q){
  const box = document.getElementById("matches");
  const t = q.trim().toLowerCase();
  let html = "";
  if(t.length >= 2){
    const terms = t.split(/\s+/);
    const hits = WINES.filter(w => {
      const hay = (w[0] + " " + w[1] + " " + w[2] + " " + w[3] + " " + w[4]).toLowerCase();
      return terms.every(x => hay.includes(x));
    }).slice(0, 8);
    html += hits.map((w,i) => {
      const wine = {name:w[0],producer:w[1],grape:w[2],region:w[3],country:w[4],style:w[5]};
      const encoded = b64EncodeUnicode(JSON.stringify(wine));
      return `
      <button class="match" onclick="addWineFromEncoded('${encoded}')">
        <span class="mn">${w[0]}</span>
        <span class="mm">${[w[1],w[2],w[3],w[4]].filter(Boolean).join(" · ")} · ${w[5]}</span>
      </button>`;
    }).join("");
    html += `<button class="manual" onclick="addManual()">Add &ldquo;${q.trim()}&rdquo; exactly as typed</button>`;
  }
  box.innerHTML = html;
}

document.getElementById("q").addEventListener("input", e => renderMatches(e.target.value));

function addWineFromEncoded(encoded){
  try {
    const w = JSON.parse(b64DecodeUnicode(encoded));
    addWine(w);
  } catch(e) {
    console.error("Failed to decode wine:", e);
  }
}

function addWine(w){
  state.wines.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2,7), ...w, prices: null, checkedAt: null });
  persist(state);
  showView("list");
}

function addManual(){
  const q = document.getElementById("q").value.trim();
  if(q.length < 2) return;
  addWine({ name: q, producer:"", grape:"", region:"", country:"", style:"" });
}

function removeWine(id){
  const card = document.querySelector(`#listView .card[data-id="${id}"]`);
  const commit = () => { persist({ wines: state.wines.filter(w => w.id !== id) }); render(); };
  if(card){
    card.classList.add("removing");
    setTimeout(commit, 260);
  } else {
    commit();
  }
}

// Wine style groups: the list is shown Rosé, White, Red (then any others),
// cheapest best price first within each group.
const STYLE_GROUPS = [["rose","Rosé"],["white","White"],["red","Red"],["sparkling","Sparkling"],["fortified","Fortified & sweet"],["other","Not sure yet"]];
const plain = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function normStyle(st){
  const t = plain(st);
  if(/^ros/.test(t)) return "rose";
  if(["white","red","sparkling","fortified"].includes(t)) return t;
  return null;
}
// For wines added by name only: a best guess from the name and grape
function guessStyle(text){
  const t = plain(text);
  if(/\bros(e|ado|ato)\b|blush|whispering angel|miraval|mirabeau|minuty|provence|white zinfandel/.test(t)) return "rose";
  if(/champagne|prosecco|\bcava\b|cremant|sparkling|\bbrut\b|franciacorta|\bfizz/.test(t)) return "sparkling";
  if(/\bport\b|sherry|madeira|marsala|sauternes|tokaji|\bfino\b|amontillado|oloroso/.test(t)) return "fortified";
  if(/sauvignon blanc|chardonnay|pinot gri|riesling|albarin|chablis|viognier|chenin|gruner|picpoul|vermentino|\bgavi\b|soave|sancerre|muscadet|semillon|verdejo|godello|fiano|torrontes|gewurz|\bwhite\b|\bblanc\b|bianco|blanco|weiss/.test(t)) return "white";
  if(/merlot|malbec|cabernet|shiraz|syrah|pinot noir|rioja|tempranillo|grenache|garnacha|primitivo|zinfandel|chianti|barolo|barbaresco|amarone|ripasso|valpolicella|claret|bordeaux|rhone|chateauneuf|beaujolais|montepulciano|nero d|carmenere|pinotage|sangiovese|nebbiolo|\bred\b|rouge|\btinto\b|rosso|douro|crozes|ribera|\bcotes du/.test(t)) return "red";
  return null;
}
function styleOf(w){
  return normStyle(w.style) || guessStyle(`${w.name} ${w.grape || ""} ${w.region || ""}`) || "other";
}
function setStyle(id, value){
  persist({ ...state, wines: state.wines.map(w => w.id === id ? { ...w, style: value === "other" ? "" : value } : w) });
  render();
}
function sortKey(w){
  const best = bestOf(w);
  return best ? best.effPrice : Infinity; // unpriced wines go to the bottom of their group
}

const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Trolley product link (or shared text containing one) or a bare code like JQK438
function parseTrolleyRef(input){
  const s = String(input || "").trim();
  let m = s.match(/trolley\.co\.uk\/product\/([^\/\s?#]+)\/([A-Za-z0-9]+)/i);
  if(m){ const sku = m[2].toUpperCase(); return { sku, url: `https://www.trolley.co.uk/product/${m[1].toLowerCase()}/${sku}` }; }
  if(/^[A-Za-z]{3}\d{3}$/.test(s)){ const sku = s.toUpperCase(); return { sku, url: `https://www.trolley.co.uk/product/x/${sku}` }; }
  return null;
}

const linkErrors = {};   // wine id -> message shown under its paste box
const relinking = new Set(); // wine ids with the "change link" box open

function startRelink(id){ relinking.add(id); render(); }
function cancelRelink(id){ relinking.delete(id); delete linkErrors[id]; render(); }

async function saveLink(id){
  const input = document.getElementById("link-" + id);
  const ref = parseTrolleyRef(input && input.value);
  if(!ref){
    linkErrors[id] = "That doesn't look like a Trolley product link. It should contain trolley.co.uk/product/…";
    render();
    return;
  }
  delete linkErrors[id];
  relinking.delete(id);
  persist({ ...state, wines: state.wines.map(w => w.id === id ? { ...w, trolley: ref, alternatives: [], prices: null, checkedAt: null, context: null, matchedName: null, outOfStock: false } : w) });
  render();
  await checkPrices([id]); // check just this wine straight away so the match can be confirmed
}

async function useAlternative(id, k){
  const w = state.wines.find(x => x.id === id);
  const a = w && (w.alternatives || [])[k];
  if(!a) return;
  persist({ ...state, wines: state.wines.map(x => x.id === id ? { ...x, trolley: { sku: a.sku, url: a.url }, alternatives: [], prices: null, checkedAt: null, context: null, matchedName: null, outOfStock: false } : x) });
  render();
  await checkPrices([id]);
}

const addingShop = new Set(); // wine ids with the "add shop link" box open
const shopErrors = {};        // wine id -> message under that box

function openShopBox(id){ addingShop.add(id); render(); const el = document.getElementById("shop-" + id); if(el) el.focus({ preventScroll: true }); }
function closeShopBox(id){ addingShop.delete(id); delete shopErrors[id]; render(); }

async function saveShopLink(id){
  const input = document.getElementById("shop-" + id);
  const m = String((input && input.value) || "").match(/https?:\/\/[^\s"'<>]+/i);
  if(!m){ shopErrors[id] = "Paste the shop's product link (it starts with https://)."; render(); return; }
  delete shopErrors[id];
  addingShop.delete(id);
  persist({ ...state, wines: state.wines.map(w => w.id === id ? { ...w, shops: [ ...(w.shops || []), { url: m[0] } ] } : w) });
  render();
  await checkPrices([id]); // the server checks the link and reads the price straight away
  if(shopErrors[id]){ addingShop.add(id); render(); }
}

async function removeShop(id, idx){
  persist({ ...state, wines: state.wines.map(w => w.id === id ? { ...w, shops: (w.shops || []).filter((_, k) => k !== idx) } : w) });
  render();
  await checkPrices([id]);
}

function checkAllPrices(){ return checkPrices(null); }

async function checkPrices(onlyIds){
  const btn = document.getElementById("checkBtn");
  const status = document.getElementById("checkStatus");
  btn.disabled = true;
  status.classList.remove("error");
  status.style.display = "block";
  status.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Fetching prices…';

  try {
    const targets = state.wines.filter(w => !onlyIds || onlyIds.includes(w.id));
    const wines = targets.map(w => ({ name: w.name, id: w.id, trolley: w.trolley ? w.trolley.url : undefined,
      shops: Array.isArray(w.shops) ? w.shops.map(x => x.url) : undefined }));
    const sentShops = Object.fromEntries(wines.map(w => [w.id, JSON.stringify(w.shops || null)]));
    const res = await fetch(API_BASE + "/api/prices", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wines }),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    const now = new Date().toISOString();
    persist({
      wines: state.wines.map(w => {
        if(onlyIds && !onlyIds.includes(w.id)) return w;
        const entry = data.results && data.results[w.name];
        if(!entry) return w;
        const trolley = entry.link || w.trolley || null; // a link saved on another device comes back here
        const changedSince = JSON.stringify(Array.isArray(w.shops) ? w.shops.map(x => x.url) : null) !== sentShops[w.id];
        const shops = !changedSince && Array.isArray(entry.shops) ? entry.shops : (w.shops || []);
        if((entry.rejectedShops || []).length) shopErrors[w.id] = entry.rejectedShops[0].error;
        if(entry.needsLink) return { ...w, trolley: null, needsLink: true, shops, shopStatus: [] };
        if(entry.error) return { ...w, trolley, shops, shopStatus: entry.shopStatus || [], needsLink: false, checkError: entry.error };
        const priceMap = entry.prices || {};
        const keys = Object.keys(priceMap);
        // order known retailers first, then any extras alphabetically
        keys.sort((a,b) => {
          const ia = RETAILER_ORDER.indexOf(a), ib = RETAILER_ORDER.indexOf(b);
          if(ia === -1 && ib === -1) return a.localeCompare(b);
          if(ia === -1) return 1;
          if(ib === -1) return -1;
          return ia - ib;
        });
        const prices = keys.map(k => ({ retailer: k, ...priceMap[k] }));
        return { ...w, trolley, shops, shopStatus: entry.shopStatus || [], majesticMatch: entry.majesticMatch || null, needsLink: false, checkError: null, matchedName: entry.matchedName || w.matchedName || null,
          outOfStock: !!entry.outOfStock, alternatives: entry.alternatives || [], prices, context: entry.context || null, checkedAt: now };
      }),
    });

    const parts = [];
    if(data.fetched || !data.cached) parts.push(`Updated ${data.fetched} wine${data.fetched === 1 ? "" : "s"}`);
    if(data.cached) parts.push(`${data.cached} already checked in the last 24h`);
    if(data.needLink) parts.push(`${data.needLink} still need${data.needLink === 1 ? "s" : ""} a link`);
    status.textContent = "✓ " + parts.join(" · ");
    setTimeout(() => { status.style.display = "none"; }, data.needLink ? 6000 : 3000);
    render();
  } catch(e){
    status.textContent = "Error: " + e.message;
    status.classList.add("error");
  } finally {
    btn.disabled = false;
  }
}

function linkBox(w){
  const err = linkErrors[w.id];
  const isChange = relinking.has(w.id);
  return `<div class="linkbox">
    <div class="lbtitle">${w.trolley ? "Change the Trolley link" : "Link this wine to Trolley (one time only)"}</div>
    <div class="lbsteps">Open Trolley, tap the right bottle (usually the 75cl one), then Share → Copy and paste the link here. After that its prices update automatically.</div>
    <a class="findbtn" href="${trolleyUrl(w.name)}" target="_blank" rel="noopener">Find “${esc(w.name)}” on Trolley ↗</a>
    <div class="lbrow">
      <input id="link-${w.id}" type="url" inputmode="url" autocomplete="off" placeholder="Paste the Trolley link">
      <button class="savebtn" onclick="saveLink('${w.id}')">Save</button>
    </div>
    ${err ? `<div class="lberr">${esc(err)}</div>` : ""}
    ${isChange ? `<div class="matched" style="margin-top:8px"><button onclick="cancelRelink('${w.id}')">Cancel</button></div>`
      : `<div class="matched" style="margin-top:10px">Not on Trolley? <button onclick="openShopBox('${w.id}')">Add a shop link instead</button></div>`}
  </div>`;
}

function shopBox(w){
  const err = shopErrors[w.id];
  const searches = DIRECT_SHOPS.map(r => `<a href="${retailerMeta(r).url(w.name)}" target="_blank" rel="noopener">${esc(r)}</a>`).join(" · ");
  return `<div class="linkbox" style="margin-top:8px">
    <div class="lbtitle">Add a shop link</div>
    <div class="lbsteps">Find the wine on one of these shops, open it, then Share → Copy and paste the link here. Its price is then read straight from the shop every check.<br>Search: ${searches}</div>
    <div class="lbrow">
      <input id="shop-${w.id}" type="url" inputmode="url" autocomplete="off" placeholder="Paste a shop's product link">
      <button class="savebtn" onclick="saveShopLink('${w.id}')">Save</button>
    </div>
    ${err ? `<div class="lberr">${esc(err)}</div>` : ""}
    <div class="matched" style="margin-top:8px">Majestic is matched automatically; add its link only to pin the exact bottle. Sainsbury's, Waitrose (use Waitrose Cellar), Co-op, Aldi and M&amp;S block automatic checks, but Trolley still covers most of them. · <button onclick="closeShopBox('${w.id}')">Cancel</button></div>
  </div>`;
}

function linksLine(w){
  const shops = w.shops || [];
  if(!w.trolley && !shops.length && !w.majesticMatch) return "";
  const parts = [];
  if(w.trolley && !relinking.has(w.id)) parts.push(`Trolley: ${esc(w.matchedName || w.trolley.sku)} · <button onclick="startRelink('${w.id}')">change</button>`);
  else if(!w.trolley) parts.push(`Trolley: not linked · <button onclick="startRelink('${w.id}')">link</button>`);
  const chips = shops.map((s, k) => `${esc(s.label || "Shop")}${editMode ? ` <button aria-label="Remove ${esc(s.label || "shop")} link" onclick="removeShop('${w.id}', ${k})">×</button>` : ""}`);
  parts.push(`${chips.length ? `Shop links: ${chips.join(", ")} · ` : ""}<button onclick="openShopBox('${w.id}')">+ shop link</button>`);
  if(w.majesticMatch) parts.push(`Majestic match: ${esc(w.majesticMatch)}`);
  return parts.map(p => `<div class="matched">${p}</div>`).join("");
}

function render(){
  const main = document.getElementById("listView");
  const hm = document.getElementById("hmeta");
  const offers = state.wines.filter(w => (w.prices||[]).some(p => p.stocked && p.offer)).length;
  hm.innerHTML = state.wines.length
    ? `${state.wines.length} wine${state.wines.length>1?"s":""}${offers ? ` · <span style="color:var(--brass)">${offers} on offer</span>` : ""}`
    : "";

  if(!state.wines.length){
    main.innerHTML = `
      <div class="empty">
        <div class="glyph">◍</div>
        <h2>Your cellar list is empty</h2>
        <p>Add the wines you love, link each one to its Trolley.co.uk page once, then tap "Check prices" whenever you like.</p>
        <button class="btn primary" onclick="showView('add')">Add your first wine</button>
      </div>`;
    return;
  }

  const card = w => {
    const best = bestOf(w);
    const list = (w.prices || []).filter(p => p.stocked && typeof p.price === "number");
    let rows;
    const msg = t => `<div class="lrow notfound"><span class="lright" style="width:100%;text-align:center">${t}</span></div>`;
    const hasShops = (w.shops || []).length > 0;
    if(!w.trolley && !hasShops && addingShop.has(w.id) && !relinking.has(w.id)){
      rows = ""; // the shop box below replaces the Trolley box
    } else if((!w.trolley && !hasShops && !(w.prices || []).length) || relinking.has(w.id)){
      rows = linkBox(w);
    } else if(w.checkError){
      rows = msg(esc(w.checkError));
    } else if(!w.checkedAt){
      rows = msg("Linked · tap Check prices");
    } else if(w.outOfStock){
      rows = msg("Out of stock at every shop Trolley tracks right now") + ((w.alternatives || []).length ? `<div class="linkbox" style="margin-top:8px">
        <div class="lbtitle">Trolley suggests these listings instead</div>
        ${w.alternatives.map((a, k) => `<div class="lbrow" style="align-items:center;justify-content:space-between;margin-top:6px"><span>${esc(a.name)}</span><button class="savebtn" onclick="useAlternative('${w.id}', ${k})">Use this</button></div>`).join("")}
      </div>` : "");
    } else if(!list.length){
      rows = msg(hasShops ? "Not in stock at your linked shops right now" : "No supermarket price found");
    } else {
      rows = list.map(p => {
        const meta = retailerMeta(p.retailer);
        const isBest = best && best.retailer === p.retailer;
        const stale = w.checkedAt && daysAgo(w.checkedAt) > 7;
        return `<div class="lrow${isBest ? " best" : ""}${stale ? " stale" : ""}">
          <a class="lret" href="${p.link || meta.url(w.name)}" target="_blank" rel="noopener"><span class="dot" style="background:${meta.dot}"></span>${p.retailer}<span class="go">↗</span></a>
          <span class="lright">
            ${p.offer ? `<span class="age" style="color:#B0463A;font-weight:600">${esc(p.offer)}</span>` : ""}
            <span class="age${stale ? " stale" : ""}">${ageLabel(w.checkedAt)}</span>
            <span class="price${isBest ? " b" : ""}">${gbp(p.price)}</span>
          </span>
        </div>`;
      }).join("");
    }
    // Linked shops that couldn't be read, or that are out of stock
    if(w.checkedAt && !relinking.has(w.id)){
      rows += (w.shopStatus || []).filter(st => !st.ok || st.inStock === false).map(st =>
        `<div class="lrow notfound"><span class="lret"><span class="dot" style="background:${retailerMeta(st.label).dot}"></span>${esc(st.label)}</span><span class="lright"><span class="age">${st.ok ? "out of stock" : esc(st.error)}</span></span></div>`).join("");
    }
    if(addingShop.has(w.id)) rows += shopBox(w);

    return `<article class="card${editMode ? " editing" : ""}" data-id="${w.id}">
      <button class="remove" onclick="removeWine('${w.id}')">×</button>
      <div class="wtop">
        <h2 class="wname">${w.name}</h2>
        <div class="wmeta">${[w.producer,w.grape,w.region,w.country].filter(Boolean).join(" · ") || "Added manually"}</div>
        ${editMode ? `<label class="stylepick">Style <select onchange="setStyle('${w.id}', this.value)">${STYLE_GROUPS.map(([k, l]) => `<option value="${k}"${styleOf(w) === k ? " selected" : ""}>${l}</option>`).join("")}</select></label>` : ""}
        ${linksLine(w)}
      </div>
      ${best ? `<div class="besttag"><span class="bestlabel">Best price</span><span class="bestval">${gbp(best.effPrice)} <small>at ${best.retailer}${best.discounted ? " · with offer" : ""}</small></span></div>` : ""}
      ${w.context ? `<div class="ctxbadge ${w.context.label.includes("Higher") ? "bad" : "good"}">${w.context.label} <span class="ctxsource">· avg ${gbp(w.context.avg)}${w.context.basis === "own" ? " from your checks" : " (est.)"}</span></div>` : ""}
      <div class="ledger">${rows}</div>
      <div class="cardfoot">
        <span>Last checked: ${w.checkedAt ? ageLabel(w.checkedAt) : "never"}</span>
        <span style="display:flex;gap:14px">
          <a class="trolley" href="https://www.majestic.co.uk/search?q=${encodeURIComponent(w.name)}" target="_blank">Majestic ↗</a>
          <a class="trolley" href="${w.trolley ? w.trolley.url : trolleyUrl(w.name)}" target="_blank" rel="noopener">Trolley ↗</a>
        </span>
      </div>
    </article>`;
  };

  // Group by style, cheapest best price first within each group
  const groups = STYLE_GROUPS.map(([key, label]) => ({ key, label,
    wines: state.wines.filter(w => styleOf(w) === key)
      .sort((a, b) => (sortKey(a) - sortKey(b)) || a.name.localeCompare(b.name)) }))
    .filter(g => g.wines.length);
  main.innerHTML = groups.map(g =>
    `<h3 class="stylehead">${g.label} <span>${g.wines.length}</span></h3>` + g.wines.map(card).join("")
  ).join("") + `<p class="footnote">Grouped by style, cheapest first within each group. Tap Edit to change a wine's style. Prices from Trolley.co.uk plus any shop links you've added (read straight from that shop's own page). Tap a store to open it. Greyed after 7 days.</p>`;
}

render();
</script>
